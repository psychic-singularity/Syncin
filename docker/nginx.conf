events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ws_cluster {
        # Sticky session routing by client IP ensures clean WebSocket handshakes
        ip_hash;
        server ws-node-1:4001 max_fails=3 fail_timeout=10s;
        server ws-node-2:4002 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 4000;
        server_name localhost;

        # Health check endpoint routing to active cluster nodes
        location /health {
            proxy_pass http://ws_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # WebSocket connection endpoint
        location / {
            proxy_pass http://ws_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-lived collaborative CRDT streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }
    }
}

