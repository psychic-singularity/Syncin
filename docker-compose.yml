services:
  # In-memory broker for horizontal Pub/Sub scale & BullMQ compaction queue
  redis:
    image: redis:alpine
    container_name: collab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # WebSocket Node 1
  ws-node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    container_name: collab-ws-node-1
    restart: unless-stopped
    environment:
      - WS_PORT=4001
      - WS_HOST=0.0.0.0
      - INSTANCE_ID=ws-node-1
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_healthy

  # WebSocket Node 2
  ws-node-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    container_name: collab-ws-node-2
    restart: unless-stopped
    environment:
      - WS_PORT=4002
      - WS_HOST=0.0.0.0
      - INSTANCE_ID=ws-node-2
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "4002:4002"
    depends_on:
      redis:
        condition: service_healthy

  # Nginx Reverse Proxy / Load Balancer
  nginx:
    image: nginx:alpine
    container_name: collab-nginx
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ws-node-1
      - ws-node-2

  # BullMQ Compaction Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: collab-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - COMPACTION_INTERVAL_MS=300000
      - COMPACTION_UPDATE_THRESHOLD=50
    depends_on:
      redis:
        condition: service_healthy

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: collab-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - nginx

